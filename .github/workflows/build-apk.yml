name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java 17 or higher is required. Found major version: '$JAVA_MAJOR'"
            exit 1
          fi
          echo "Java environment verified (Java $JAVA_MAJOR)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Temporary debug keystore created successfully."
          else
            echo "Debug keystore already exists."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file at $APK_PATH is empty"
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: Output artifact does not have .apk extension: $APK_PATH"
            exit 1
          fi
          echo "Verified debug APK artifact exists and is non-empty:"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "${RELEASE_DIR}/app-debug.apk"
          echo "asset_path=${RELEASE_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at ${RELEASE_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES="### Velora Debug APK Build
          - **Run Number**: #${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: ${{ github.sha }}
          - **Signing**: Signed with temporary debug keystore for development and testing.
          - **Notice**: This build is a debug artifact and is not intended for the Google Play Store."

          echo "Publishing release: $TAG_NAME ($RELEASE_TITLE)"
          gh release create "$TAG_NAME" "${{ steps.prepare_asset.outputs.asset_path }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          echo "=================================================="
          echo "Tag: $TAG_NAME"
          echo "Title: $RELEASE_TITLE"
          echo "Direct Download URL: $DIRECT_URL"
          echo "=================================================="

          echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Direct Link**: [app-debug.apk]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository**: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag**: \`${TAG_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact**: \`app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "- **Release Status**: Published successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Release Status**: Release publishing was skipped or encountered an error. The APK is also preserved in Workflow Artifacts under \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
          fi
